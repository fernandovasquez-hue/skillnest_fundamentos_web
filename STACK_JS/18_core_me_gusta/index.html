<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fernando Vásquez">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="barra_inicio">
            <h1>Social Like</h1>
        </nav>
    </header>
    <main>

        <section class="contenedor_perfil">
            <div class="perfil">
                <img src="static/images/Misato_foto_perfil.png" alt="Minato_foto_perfil">
                <h2>Misato</h2>
                <button class="ver_perfil">Mi perfil</button>
            </div>
        </section>

        <section class="contenedor_tarjetas">
            <h2>Útimas publicaciones</h2>

            <div class="publicaciones">
                <div class="informacion_parte_arriba">
                    <div class="nombre_perfil">
                        <h3>Rei</h3>
                    </div>
                    <div class="me_gusta">
                        <p id="likesPublicaion1">0 like(s)</p>
                        <button class="boton_me_gusta" id="aumentadorLikes1">Like</button>
                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>Acabo de configurar este nuevo <a href="">bot de discord</a>, cuéntame que opinan ustedes.</p>
                </div>
            </div>

            <div class="publicaciones">
                <div class="informacion_parte_arriba">
                    <div class="nombre_perfil">
                        <h3>Asuka</h3>
                    </div>
                    <div class="me_gusta">
                        <p id="likesPublicaion2">0 like(s)</p>
                        <button class="boton_me_gusta" id="aumentadorLikes2">Like</button>
                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>Acabo de leer este <a href="">nuevo comic</a>. Denle un vistazo.</p>
                </div>
            </div>

            <div class="publicaciones">
                <div class="informacion_parte_arriba">
                    <div class="nombre_perfil">
                        <h3>Shinji</h3>
                    </div>
                    <div class="me_gusta">
                        <p id="likesPublicaion3">0 like(s)</p>
                        <button class="boton_me_gusta" id="aumentadorLikes3">Like</button>
                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>No puedo dejar de escuchar este <a href="">album</a>. ¿A quién más le gusta?</p>
                </div>
            </div>

        </section>

    </main>
    <script src="static/js/script.js" defer></script>
</body>

</html>
