<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fernando Vásquez">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">

<body>
    <header>

                        <p id="likesPublicaion1">0 like(s)</p>

                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>Acabo de configurar este nuevo <a href="https://discord.com/invite/aihub">bot de discord</a>,
                        cuéntame que opinan ustedes.</p>

            </div>

            <div class="publicaciones">
                <div class="informacion_parte_arriba">
                    <div class="nombre_perfil">
                        <h3>Asuka</h3>
                    </div>
                    <div class="me_gusta">
                        <p id="likesPublicaion2">0 like(s)</p>
                        <button class="boton_me_gusta" id="aumentadorLikes2">Like</button>
                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>Acabo de leer este
                        <a
                            href="https://tiendapanini.cl/marvel-gold-el-asombroso-spiderman-8-escaramuza-bajo-las-calles?_gl=1*uorjxj*_up*MQ..*_ga*NDc2MzE2MDQ0LjE3ODgzNzY5NzM.*_ga_CDL0K6YYW5*czE3ODgzNzY5NzMkbzEkZzAkdDE3ODgzNzY5NzMkajYwJGwwJGgw*_ga_9JG210ZVEM*czE3ODgzNzY5NzMkbzEkZzAkdDE3ODgzNzY5NzMkajYwJGwwJGg0ODM0MzYxNTA.">
                            nuevo comic
                        </a>
                        . Denle un vistazo.</p>
                </div>
            </div>

            <div class="publicaciones">
                <div class="informacion_parte_arriba">
                    <div class="nombre_perfil">
                        <h3>Shinji</h3>
                    </div>
                    <div class="me_gusta">
                        <p id="likesPublicaion3">0 like(s)</p>
                        <button class="boton_me_gusta" id="aumentadorLikes3">Like</button>
                    </div>
                </div>
                <div class="informacion_publicacion">
                    <p>No puedo dejar de escuchar este <a href="https://www.youtube.com/watch?v=fv8JDmbCF_A&list=RDfv8JDmbCF_A&start_radio=1">album</a>. ¿A quién más le gusta?</p>
                </div>
            </div>

        </section>

    </main>
    <script src="static/js/script.js" defer></script>
</body>

</html>
