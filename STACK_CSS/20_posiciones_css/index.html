<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fernando Vásquez">
    <title>posiciones de elementos CSS</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="barra-navegacion">
            <h1>position: static</h1>
            <a href="#" class="enlace-nav">Haz scroll hacia abajo ⬇️</a>
        </nav>
    </header>
    <main class="contenedor-principal">
        <section class="tarjeta">
            <h2>position: relative</h2>
            <p>texto dentro</p>
            <div class="caja">
                hola
            </div>
        </section>
        <section class="tarjeta">
            <h2>position: absolute</h2>
            <p>texto dentro</p>
            <div class="caja">
                hola
            </div>
        </section>
        <section class="tarjeta">
            <h2>position: fixed</h2>
            <p>texto dentro</p>
            <div class="caja">
                hola
            </div>
        </section>
    </main>
</body>

</html>
